[tool.poetry]
name = "pulpy"
version = "1.9.0"
description = "PulPy: Pulses in Python. A package for MRI RF and gradient pulse design."
authors = ["jonbmartin <jon.bach.martin@gmail.com>"]
license = "MIT"
readme = "README.rst"
homepage = "https://github.com/jonbmartin/pulpy"
repository = "https://github.com/jonbmartin/pulpy"
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering"
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
numpy = ">=1.24.4,<3.0.0"
numba = ">=0.59.1,<1.0.0"
scipy = ">=1.13.1,<2.0.0"
sigpy = ">=0.1.26,<1.0.0"

[tool.poetry.group.dev.dependencies]
coverage = "^7.5.3"
ruff = "^0.4.8"
Sphinx = "^8.0.2"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.pdf'
check-hidden = true
ignore-regex = '\b(TE|Reson|Ser)\b'
# ignore-words-list = ''

[tool.ruff.lint]
# Ruff's historical default rule set, pinned explicitly. The CI lint step runs a
# bare `pip install ruff`, so it always tracks the latest release, and newer ruff
# versions enable far more rules by default (115 findings as of 0.17.1). Without
# an explicit select, every ruff release silently changes what CI reports.
select = ["E4", "E7", "E9", "F"]
